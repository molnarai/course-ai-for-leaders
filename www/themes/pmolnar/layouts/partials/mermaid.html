{{- /* Loaded only on pages containing a ```mermaid fence (see
       _default/_markup/render-codeblock-mermaid.html, which sets the flag). */ -}}
<style>
  pre.mermaid {
    background: none;
    border: none;
    padding: 0;
    margin: 1.5rem 0;
    text-align: center;
    overflow-x: auto;
  }
  pre.mermaid:not([data-processed]) {
    visibility: hidden;
  }
  pre.mermaid svg {
    max-width: 100%;
    height: auto;
  }
</style>
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
  mermaid.initialize({
    startOnLoad: true,
    securityLevel: "strict",
    theme: "base",
    fontFamily: "sans-serif",
    themeVariables: {
      primaryColor: "#f0f6ff",
      primaryTextColor: "#1a1a1a",
      primaryBorderColor: "#003478",
      lineColor: "#0066cc",
      secondaryColor: "#f4f4f4",
      secondaryBorderColor: "#999999",
      tertiaryColor: "#f9f9f9",
      tertiaryBorderColor: "#cccccc",
      clusterBkg: "#fbfcfe",
      clusterBorder: "#003478",
      titleColor: "#003478",
      edgeLabelBackground: "#ffffff",
      fontSize: "15px",
    },
  });
</script>
